services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: workout_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - "5044:8080"
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=workout_db;Username=postgres;Password=postgres123
    expose:
      - "8080"
    depends_on:
      - db
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend


volumes:
  pgdata: